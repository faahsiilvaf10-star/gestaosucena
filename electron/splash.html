<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Iniciando...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      overflow: hidden;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }
    img {
      width: 80%;
      max-width: 450px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      animation: pulse 2.5s ease-in-out infinite;
    }
    .loading-container {
      width: 250px;
      height: 4px;
      background: rgba(255, 255, 255, 0.05); /* Fundo quase imperceptível / "sem fundo" */
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: #facc15; /* Amarelo da logo Sucena */
      border-radius: 4px;
      box-shadow: 0 0 12px #facc15;
      animation: loading 1.5s ease-in-out infinite alternate;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); width: 20%; }
      100% { transform: translateX(250px); width: 60%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="../public/logo.png" alt="Logo">
  </div>
  <div class="loading-container">
    <div class="loading-bar"></div>
  </div>
</body>
</html>
